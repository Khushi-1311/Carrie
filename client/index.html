<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CARRIE | AI College Assistant</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            🤖

            <div>

                <h1>CARRIE</h1>

                <p>AI College Assistant</p>

            </div>

        </div>

        <div class="status">

            <span class="dot"></span>

            Online

        </div>

    </header>

    <!-- ================= MAIN ================= -->

    <main>

        <!-- Welcome Card -->

        <section id="welcome-card" class="welcome-card">

            <h2>Welcome to CARRIE</h2>

            <p>

                Your AI-powered college assistant.

            </p>

            <div class="features">

                <span>Admissions</span>

                <span>Courses</span>

                <span>Fees</span>

                <span>Placements</span>

                <span>Library</span>

                <span>Hostel</span>

            </div>

        </section>

        <!-- Chat -->

        <section
            id="chat-box"
            class="chat-box">

        </section>

    </main>

    <!-- ================= INPUT ================= -->

    <footer>

        <input
            type="text"
            id="user-input"
            placeholder="Ask anything about your college...">

        <button id="send-btn">

            ➜

        </button>

    </footer>

    <!-- JS -->


    <script type= "module" src="js/script.js"></script>

</body>

</html>
